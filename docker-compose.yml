services:
  librespeed:
    image: linuxserver/librespeed:latest
    container_name: librespeed
    hostname: librespeed
    restart: always
    volumes:
      - ./config:/config
    networks:
      macvlan:
        ipv4_address: ${ipv4}
        ipv6_address: ${ipv6}
        mac_address: ${macaddress}
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.accept_ra_rt_info_max_plen=128


networks:
  macvlan:
    external: true
    name: ${MACVLAN_NET}